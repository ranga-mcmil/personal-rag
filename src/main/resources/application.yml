spring:
  application:
    name: second-brain
  datasource:
    url: jdbc:postgresql://localhost:5432/secondbrain
    username: secondbrain
    password: secondbrain
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: nomic-embed-text
      chat:
        model: llama3.2

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000